[project]
name = "touchsynth"
version = "1.4.0"
description = "Touch synth: two people touching skin to skin play an expressive ambient pad (Raspberry Pi Pico 2 sensor + Python synth)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "pyserial>=3.5",
]

[project.scripts]
touchsynth = "touchsynth.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["touchsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
