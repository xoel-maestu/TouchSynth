[project]
name = "touchsynth"
version = "1.0.0"
description = "An expressive ambient synth played by two people touching skin to skin (Raspberry Pi Pico 2 sensor + Python synthesis)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xoel Maestu" }]
keywords = ["synthesizer", "touch", "skin conductance", "raspberry-pi-pico", "circuitpython", "sound-art", "nime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "pyserial>=3.5",
]

[project.urls]
Repository = "https://github.com/xoel-maestu/touchsynth"
Issues = "https://github.com/xoel-maestu/touchsynth/issues"

[project.scripts]
touchsynth = "touchsynth.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["touchsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
